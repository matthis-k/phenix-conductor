name: worker-404-simplify-plan

on:
  push:
    branches:
      - feat/layered-service-overrides
    paths:
      - .github/workflows/worker-404-simplify-plan.yml

permissions:
  contents: write

jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Apply simplification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          path = Path("rust/crates/phenix-core/src/metadata_reconciliation.rs")
          text = path.read_text()
          text = replace_once(
              text,
              """pub struct MetadataReconciliationPreview {
              pub graph: ReconciliationPreview,
              pub metadata: CompositionMetadataDiff,
              pub transition_plan: Vec<ReconciliationAction>,
          }
          """,
              """pub struct MetadataReconciliationPreview {
              pub graph: ReconciliationPreview,
              pub metadata: CompositionMetadataDiff,
          }
          """,
              "preview duplicate plan field",
          )
          text = replace_once(
              text,
              "        let graph = self.preview_candidate(candidate);\n",
              "        let mut graph = self.preview_candidate(candidate);\n",
              "mutable graph preview",
          )
          text = replace_once(
              text,
              "        let mut transition_plan = graph.transition_plan.clone();\n",
              "",
              "duplicate plan clone",
          )
          text = text.replace("transition_plan.iter()", "graph.transition_plan.iter()")
          text = text.replace("transition_plan.push(", "graph.transition_plan.push(")
          text = text.replace(
              "let already_restarted: BTreeSet<_> = transition_plan",
              "let already_restarted: BTreeSet<_> = graph.transition_plan",
          )
          text = text.replace("        transition_plan.extend(\n", "        graph.transition_plan.extend(\n")
          text = replace_once(
              text,
              """        Ok(MetadataReconciliationPreview {
                      graph,
                      metadata,
                      transition_plan,
                  })
          """,
              """        Ok(MetadataReconciliationPreview { graph, metadata })
          """,
              "preview construction",
          )
          text = text.replace("preview.transition_plan", "preview.graph.transition_plan")
          text = text.replace(
              "preview\n            .transition_plan",
              "preview\n            .graph\n            .transition_plan",
          )
          text = replace_once(
              text,
              """        let mut active_input = fixture();
                  active_input.resources.push(resource());
          """,
              """        let mut active_input = fixture();
                  active_input.packages[0]
                      .packaged_resources
                      .insert("fixture.skill".into());
                  active_input.resources.push(resource());
          """,
              "resource ownership fixture",
          )
          path.write_text(text)

          path = Path("rust/crates/phenix-core/src/live_reconciliation.rs")
          text = path.read_text()
          start = text.index("    pub fn activate_candidate_on_kernel_with_metadata(")
          end = text.index("\n}\n\nfn validate_live_reconciliation", start)
          block = text[start:end]
          count = block.count("preview.transition_plan")
          if count < 1:
              raise SystemExit("metadata activation: preview.transition_plan not found")
          block = block.replace("preview.transition_plan", "preview.graph.transition_plan")
          text = text[:start] + block + text[end:]
          path.write_text(text)

          path = Path("rust/crates/phenix-core/tests/resource_metadata_reconciliation.rs")
          text = path.read_text()
          text = text.replace("preview.transition_plan", "preview.graph.transition_plan")
          path.write_text(text)

          path = Path("rust/crates/phenix-core/src/runtime.rs")
          text = path.read_text()
          text = replace_once(
              text,
              "    PluginExecution, PluginId, PluginManifest, ProviderBinding, ResolvedComponentGraph,\n",
              "    PluginExecution, PluginId, PluginManifest, ResolvedComponentGraph,\n",
              "dead ProviderBinding import",
          )
          text = replace_once(
              text,
              """    pub(crate) fn resolve_service(
                  &self,
                  service: &ServiceId,
                  binding: Option<&PluginId>,
              ) -> Result<ProviderBinding, KernelError> {
                  self.config.resolve(service, self.authority, binding)
              }

          """,
              "",
              "dead PluginHost::resolve_service",
          )
          text = replace_once(
              text,
              """    pub(crate) fn invoke_service(
                  &self,
                  service: &ServiceId,
                  input: &[u8],
                  requested_authority: &Authority,
                  binding: Option<&PluginId>,
              ) -> Result<Vec<u8>, KernelError> {
                  let delegated_authority = self.authority.attenuate(requested_authority);
                  invoke_service_with(
                      InvocationContext {
                          graph_generation: self.graph_generation,
                          component_graph: self.component_graph,
                          config: self.config,
                          states: self.states,
                          instances: self.instances,
                          events: self.events,
                          tasks: self.tasks,
                          persistence: self.persistence,
                          provenance: self.provenance,
                      },
                      service,
                      input,
                      &delegated_authority,
                      binding,
                      &self.call_stack,
                      &self.active_services,
                  )
              }

          """,
              "",
              "legacy PluginHost::invoke_service",
          )
          path.write_text(text)

          path = Path("rust/crates/phenix-core/src/service_layer_dispatch_regression.rs")
          text = path.read_text()
          text = replace_once(text, "    Reenter,\n", "", "legacy reentry behavior")
          text = replace_once(
              text,
              """            Behavior::Reenter => {
                  let error = host
                      .invoke_service(service, input, host.authority(), None)
                      .unwrap_err();
                  Ok(LayerResult::Handled(error.to_string().into_bytes()))
              }
          """,
              "",
              "legacy reentry arm",
          )
          text = replace_once(
              text,
              """#[test]
          fn same_service_recursive_invocation_is_rejected() {
              let mut kernel = kernel_with_layer(
                  Behavior::Reenter,
                  Arc::new(AtomicBool::new(false)),
                  Authority::default(),
              );
              let output = kernel
                  .invoke(&service(), b"x", &Authority::default(), None)
                  .unwrap();
              assert!(String::from_utf8(output)
                  .unwrap()
                  .contains("same-service re-entry"));
          }

          """,
              "",
              "legacy reentry regression",
          )
          path.write_text(text)

          Path("rust/crates/phenix-core/src/host_authority_regression.rs").write_text(r'''use phenix_core::{
              Authority, CapabilityId, ComponentExport, ComponentId, ComponentImport,
              ComponentInterface, ComponentManifest, InterfaceId, Kernel, KernelConfig,
              PluginExecution, PluginHost, PluginId, PluginInstance, PluginManifest,
              ResolvedHarness, ResolvedHarnessActivation, ServiceContribution, ServiceId,
              ServiceRole,
          };

          fn plugin(value: &str) -> PluginId {
              PluginId::parse(value).unwrap()
          }

          fn component(value: &str) -> ComponentId {
              ComponentId::parse(value).unwrap()
          }

          fn service(value: &str) -> ServiceId {
              ServiceId::parse(value).unwrap()
          }

          fn interface(value: &str) -> InterfaceId {
              InterfaceId::parse(value).unwrap()
          }

          fn capability(value: &str) -> CapabilityId {
              CapabilityId::parse(value).unwrap()
          }

          struct DownstreamInterface;

          impl ComponentInterface for DownstreamInterface {
              type Request = ();
              type Response = String;

              fn interface_id() -> InterfaceId {
                  interface("downstream@1")
              }
          }

          struct Downstream;

          impl PluginInstance for Downstream {
              fn start(&mut self, _host: &PluginHost<'_>) -> Result<(), String> {
                  Ok(())
              }

              fn invoke(
                  &mut self,
                  _service: &ServiceId,
                  _input: &[u8],
                  _host: &PluginHost<'_>,
              ) -> Result<Vec<u8>, String> {
                  serde_json::to_vec("unexpected").map_err(|error| error.to_string())
              }
          }

          struct Delegator;

          impl PluginInstance for Delegator {
              fn start(&mut self, _host: &PluginHost<'_>) -> Result<(), String> {
                  Ok(())
              }

              fn invoke(
                  &mut self,
                  _service: &ServiceId,
                  _input: &[u8],
                  host: &PluginHost<'_>,
              ) -> Result<Vec<u8>, String> {
                  for _ in 0..2 {
                      if host
                          .invoke_import::<DownstreamInterface>(&component("delegator.component"), &())
                          .is_ok()
                      {
                          return Err("delegated call regained denied authority".into());
                      }
                  }
                  Ok(b"denied-twice".to_vec())
              }
          }

          #[test]
          fn plugin_delegation_and_retry_cannot_regain_denied_authority() {
              let read = capability("fs.read");
              let write = capability("fs.write");
              let delegator = PluginManifest {
                  id: plugin("delegator"),
                  version: 1,
                  execution: PluginExecution::Embedded,
                  dependencies: Vec::new(),
                  services: vec![ServiceContribution {
                      role: ServiceRole::Terminal,
                      service: service("root@1"),
                      priority: 1,
                      required_authority: Authority::default(),
                  }],
                  resource_namespaces: Vec::new(),
                  maximum_authority: Authority::new([read.clone(), write.clone()]),
              };
              let downstream = PluginManifest {
                  id: plugin("downstream"),
                  version: 1,
                  execution: PluginExecution::Embedded,
                  dependencies: Vec::new(),
                  services: vec![ServiceContribution {
                      role: ServiceRole::Terminal,
                      service: service("downstream@1"),
                      priority: 1,
                      required_authority: Authority::new([write.clone()]),
                  }],
                  resource_namespaces: Vec::new(),
                  maximum_authority: Authority::new([write.clone()]),
              };
              let components = [
                  ComponentManifest {
                      id: component("delegator.component"),
                      owner: delegator.id.clone(),
                      imports: vec![ComponentImport {
                          interface: DownstreamInterface::interface_id(),
                          required: true,
                          authority: Authority::new([write.clone()]),
                      }],
                      exports: Vec::new(),
                      maximum_authority: Authority::new([read.clone(), write.clone()]),
                  },
                  ComponentManifest {
                      id: component("downstream.component"),
                      owner: downstream.id.clone(),
                      imports: Vec::new(),
                      exports: vec![ComponentExport {
                          interface: DownstreamInterface::interface_id(),
                          priority: 1,
                          required_authority: Authority::new([write.clone()]),
                      }],
                      maximum_authority: Authority::new([write.clone()]),
                  },
              ];
              let manifests = [delegator.clone(), downstream.clone()];
              let resolved = ResolvedHarness::resolve(
                  manifests.clone(),
                  components,
                  [],
                  &Authority::new([read.clone(), write]),
              )
              .unwrap();
              let mut kernel = Kernel::new(KernelConfig::new(manifests).unwrap());
              kernel.activate_resolved_harness(&resolved).unwrap();
              kernel
                  .register_embedded_factory(delegator.id, || Box::new(Delegator))
                  .unwrap();
              kernel
                  .register_embedded_factory(downstream.id, || Box::new(Downstream))
                  .unwrap();
              kernel.activate_all().unwrap();

              assert_eq!(
                  kernel
                      .invoke(&service("root@1"), b"", &Authority::new([read]), None)
                      .unwrap(),
                  b"denied-twice"
              );
          }
          ''')
          PY

      - name: Format and validate
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all
          nix run .#phenix-maintenance-command-1c6e6c4c02e5 -- fix
          cargo test --manifest-path rust/Cargo.toml -p phenix-core
          cargo clippy --manifest-path rust/Cargo.toml -p phenix-core --all-targets -- -D warnings
          git diff --check

      - name: Commit semantic change
        run: |
          set -euo pipefail
          rm .github/workflows/worker-404-simplify-plan.yml
          git config user.name "phenix-worker"
          git config user.email "phenix-worker@users.noreply.github.com"
          git add -A
          git commit -m "refactor: simplify metadata reconciliation state"
          git push origin HEAD:feat/layered-service-overrides

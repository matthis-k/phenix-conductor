name: Worker 399 suite convergence repair

on:
  push:
    branches:
      - feat/plugin-kernel-implementation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: feat/plugin-kernel-implementation
          fetch-depth: 0
      - name: Converge first-party suite services
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          planning = Path('rust/crates/phenix-plugin-suite/src/planning.rs')
          text = planning.read_text()
          text = text.replace('matches_query(&query, [&objective.title])', 'matches_query(&query, [objective.title.as_str()])')
          text = text.replace('matches_query(&query, [&plan.goal])', 'matches_query(&query, [plan.goal.as_str()])')
          text = text.replace(
              'matches_query(&query, [&decision.statement, &decision.rationale])',
              'matches_query(&query, [decision.statement.as_str(), decision.rationale.as_str()])',
          )
          planning.write_text(text)

          execution = Path('rust/crates/phenix-plugin-suite/src/execution.rs')
          text = execution.read_text()
          old = '''    let requested = execution\n        .authority\n        .attenuate(&callable.required_authority)?\n        .parse()?;\n    if !callable.required_authority.parse()?.permits_all(&requested) {\n        return Err(format!("invalid callable authority: {callable_id}"));\n    }\n'''
          new = '''    let required = callable.required_authority.parse()?;\n    if !execution.authority.parse()?.permits_all(&required)\n        || !host.authority().permits_all(&required)\n    {\n        return Err(format!("callable authority denied: {callable_id}"));\n    }\n    let requested = required;\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'callable authority denied' not in text:
              raise SystemExit('callable authority marker missing')
          execution.write_text(text)

          harness = Path('rust/crates/phenix-harness/src/lib.rs')
          text = harness.read_text()
          old = '''    artifact_factory, artifact_manifest, context_factory, context_manifest, planning_factory,\n    planning_manifest, repository_worker_factory, repository_worker_manifest, session_factory,\n    session_manifest,\n'''
          new = '''    artifact_factory, artifact_manifest, context_factory, context_manifest, execution_factory,\n    execution_manifest, language_factory, language_manifest, planning_factory, planning_manifest,\n    repository_worker_factory, repository_worker_manifest, session_factory, session_manifest,\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'execution_factory' not in text or 'language_factory' not in text:
              raise SystemExit('harness import marker missing')

          old = '''        builder.add_embedded(context_manifest(), context_factory)?;\n        builder.add_embedded(planning_manifest(), planning_factory)?;\n'''
          new = '''        builder.add_embedded(context_manifest(), context_factory)?;\n        builder.add_embedded(execution_manifest(Authority::default()), execution_factory)?;\n        builder.add_embedded(language_manifest(), language_factory)?;\n        builder.add_embedded(planning_manifest(), planning_factory)?;\n'''
          if old in text:
              text = text.replace(old, new, 1)
          else:
              if 'execution_manifest(Authority::default())' not in text:
                  raise SystemExit('execution harness composition missing')
              if 'builder.add_embedded(language_manifest(), language_factory)?;' not in text:
                  text = text.replace(
                      '        builder.add_embedded(execution_manifest(Authority::default()), execution_factory)?;\n',
                      '        builder.add_embedded(execution_manifest(Authority::default()), execution_factory)?;\n        builder.add_embedded(language_manifest(), language_factory)?;\n',
                      1,
                  )

          text = text.replace('assert_eq!(harness.kernel().config().manifests().count(), 5);', 'assert_eq!(harness.kernel().config().manifests().count(), 7);')
          text = text.replace('assert_eq!(harness.kernel().config().manifests().count(), 6);', 'assert_eq!(harness.kernel().config().manifests().count(), 7);')
          harness.write_text(text)
          PY
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo test --manifest-path rust/Cargo.toml -p phenix-plugin-suite --lib
          cargo test --manifest-path rust/Cargo.toml -p phenix-harness --lib
          rm -f .github/workflows/worker-399-execution-compose.yml
          rm .github/workflows/worker-399-execution-repair.yml
          git diff --check
      - name: Commit converged suite tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: converge execution planning and language plugins'
          git push origin HEAD:feat/plugin-kernel-implementation

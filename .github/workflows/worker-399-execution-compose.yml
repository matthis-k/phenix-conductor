name: Worker 399 execution composition

on:
  push:
    branches:
      - feat/plugin-kernel-implementation

permissions:
  contents: write

jobs:
  compose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: feat/plugin-kernel-implementation
          fetch-depth: 0
      - name: Complete execution composition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('rust/crates/phenix-plugin-suite/src/execution.rs')
          text = path.read_text()
          old = '''    let requested = execution\n        .authority\n        .attenuate(&callable.required_authority)?\n        .parse()?;\n    if !callable.required_authority.parse()?.permits_all(&requested) {\n        return Err(format!("invalid callable authority: {callable_id}"));\n    }\n'''
          new = '''    let required = callable.required_authority.parse()?;\n    if !execution.authority.parse()?.permits_all(&required)\n        || !host.authority().permits_all(&required)\n    {\n        return Err(format!("callable authority denied: {callable_id}"));\n    }\n    let requested = required;\n'''
          if old not in text:
              raise SystemExit('callable authority marker missing')
          path.write_text(text.replace(old, new, 1))

          harness = Path('rust/crates/phenix-harness/src/lib.rs')
          text = harness.read_text()
          text = text.replace(
              '''    artifact_factory, artifact_manifest, context_factory, context_manifest, planning_factory,\n    planning_manifest, repository_worker_factory, repository_worker_manifest, session_factory,\n    session_manifest,\n''',
              '''    artifact_factory, artifact_manifest, context_factory, context_manifest, execution_factory,\n    execution_manifest, planning_factory, planning_manifest, repository_worker_factory,\n    repository_worker_manifest, session_factory, session_manifest,\n''',
              1,
          )
          text = text.replace(
              '''        builder.add_embedded(context_manifest(), context_factory)?;\n        builder.add_embedded(planning_manifest(), planning_factory)?;\n''',
              '''        builder.add_embedded(context_manifest(), context_factory)?;\n        builder.add_embedded(execution_manifest(Authority::default()), execution_factory)?;\n        builder.add_embedded(planning_manifest(), planning_factory)?;\n''',
              1,
          )
          text = text.replace('assert_eq!(harness.kernel().config().manifests().count(), 5);', 'assert_eq!(harness.kernel().config().manifests().count(), 6);')
          harness.write_text(text)
          PY
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo test --manifest-path rust/Cargo.toml -p phenix-plugin-suite --lib execution::tests
          cargo test --manifest-path rust/Cargo.toml -p phenix-harness --lib
          rm .github/workflows/worker-399-execution-compose.yml
          git diff --check
      - name: Commit execution semantic tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: add plugin-owned execution and worker service'
          git push origin HEAD:feat/plugin-kernel-implementation

name: Worker 399 Harness protocol wire

on:
  push:
    branches:
      - feat/plugin-kernel-implementation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: feat/plugin-kernel-implementation
          fetch-depth: 0

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Apply protocol-owned Harness wire
        run: python scripts/worker_399_protocol_wire.py

      - name: Canonical fixes
        run: nix run .#phenix-maintenance -- fix

      - name: Refresh Cargo lock
        run: |
          cd rust
          cargo generate-lockfile

      - name: Protocol and Harness tests
        run: |
          cd rust
          cargo test --locked -p phenix-protocol
          cargo test --locked -p phenix-harness
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Harness process/system parity
        run: |
          nix run .#phenix-maintenance -- test system harness-process-roundtrip
          nix run .#phenix-maintenance -- test system harness-supported-product

      - name: Product and Source
        run: |
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          nix build --no-link --print-build-logs ".#checks.$system.phenix-product-smoke"
          nix run .#phenix-maintenance -- check source
          git diff --check

      - name: Clean transport
        run: rm scripts/worker_399_protocol_wire.py .github/workflows/worker-399-protocol-wire.yml

      - name: Commit canonical Harness wire
        run: |
          set -euo pipefail
          git config user.name "Matthis Kälble"
          git config user.email "69082876+matthis-k@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: own Harness service wire in protocol crate"
          git push origin HEAD:feat/plugin-kernel-implementation

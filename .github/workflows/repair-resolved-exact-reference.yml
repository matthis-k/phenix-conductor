name: Repair resolved exact reference API

on:
  push:
    branches:
      - context-07-context-catalog-implementation

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: context-07-context-catalog-implementation
      - name: Repair public API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          lib = Path("rust/crates/phenix-conductor/src/lib.rs")
          text = lib.read_text()
          old = """pub use execution_provider::{\n    ExecutionProvider, ExecutionProviderBinding, ExecutionProviderError, ExecutionProviderEvent,\n    ExecutionProviderHost, ExecutionProviderKind, ExecutionProviderRequest,\n};"""
          new = """pub use execution_provider::{\n    ExecutionProvider, ExecutionProviderBinding, ExecutionProviderError, ExecutionProviderEvent,\n    ExecutionProviderHost, ExecutionProviderKind, ExecutionProviderRequest, ResolvedExactReference,\n};"""
          if old not in text:
              raise SystemExit("expected execution-provider re-export block not found")
          lib.write_text(text.replace(old, new, 1))

          provider = Path("rust/crates/phenix-conductor/src/execution_provider.rs")
          text = provider.read_text()
          old = "    #[allow(private_interfaces)]\n    pub fn resolve_exact_reference("
          if old not in text:
              raise SystemExit("expected private_interfaces suppression not found")
          provider.write_text(text.replace(old, "    pub fn resolve_exact_reference(", 1))
          PY
          rm .github/workflows/repair-resolved-exact-reference.yml
          git diff --check
          git config user.name "Matthis Kälble"
          git config user.email "69082876+matthis-k@users.noreply.github.com"
          git add rust/crates/phenix-conductor/src/lib.rs rust/crates/phenix-conductor/src/execution_provider.rs .github/workflows/repair-resolved-exact-reference.yml
          git commit -m "fix: expose exact reference result type"
          git push origin HEAD:context-07-context-catalog-implementation

name: Worker 399 Harness runtime migration

on:
  push:
    branches:
      - feat/plugin-kernel-implementation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: feat/plugin-kernel-implementation
          fetch-depth: 0
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Build real Harness runtime
        shell: bash
        run: |
          set -euo pipefail
          python scripts/worker399_harness_runtime.py
          python scripts/worker399_harness_runtime_fix.py
          python - <<'PY'
          from pathlib import Path

          context = Path("rust/crates/phenix-plugin-suite/src/context.rs")
          text = context.read_text()
          old = """use phenix_kernel::{
              execution_factory, execution_manifest, execution_service, ExecutionAuthority, ExecutionCommand,
              ExecutionId, Plugin, PluginError, PluginFactory, PluginHost, PluginManifest, ServiceDescriptor,
          };
          """
          new = """use phenix_kernel::{
              execution_service, ExecutionCommand, ExecutionId, Plugin, PluginError, PluginFactory, PluginHost,
              PluginManifest, ServiceDescriptor,
          };
          """
          if old not in text:
              raise SystemExit("stale context import block missing")
          context.write_text(text.replace(old, new, 1))

          hooks = Path("rust/crates/phenix-plugin-suite/src/hooks.rs")
          text = hooks.read_text()
          old = '.invoke(&host, "hook-service",'
          if old not in text:
              raise SystemExit("hook-service needless borrow missing")
          hooks.write_text(text.replace(old, '.invoke(host, "hook-service",', 1))
          PY
          # Flake source filtering excludes untracked files. Track the newly created
          # Harness binary before any Nix build so the derivation sees src/main.rs.
          git add rust/crates/phenix-harness/src/main.rs
          nix run .#phenix-maintenance -- fix
          cargo test --manifest-path rust/Cargo.toml -p phenix-harness
          cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings
          nix build .#phenix-harness --no-link
          nix build .#checks.x86_64-linux.phenix-product-smoke --no-link
          rm .github/workflows/worker-399-harness-runtime.yml
          rm scripts/worker399_harness_runtime.py
          rm scripts/worker399_harness_runtime_fix.py
          git diff --check
      - name: Commit Harness runtime migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: make Harness the supported plugin runtime'
          git push origin HEAD:feat/plugin-kernel-implementation

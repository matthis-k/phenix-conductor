name: Worker 399 Harness runtime migration

on:
  push:
    branches:
      - feat/plugin-kernel-implementation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: feat/plugin-kernel-implementation
          fetch-depth: 0
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Apply Harness runtime transform
        shell: bash
        run: |
          set -euo pipefail
          python scripts/worker399_harness_runtime.py
          python scripts/worker399_harness_runtime_fix.py
          python - <<'PY'
          from pathlib import Path
          import re

          context = Path("rust/crates/phenix-plugin-suite/src/context.rs")
          text = context.read_text()
          old = '''use crate::{
              execution_factory, execution_manifest, execution_service, ExecutionAuthority, ExecutionCommand,
              ExecutionResponse, ExecutionState,
          };
          '''
          new = '''use crate::{execution_service, ExecutionCommand, ExecutionResponse, ExecutionState};
          '''
          if old not in text:
              raise SystemExit("context execution import block missing")
          text = text.replace(old, new, 1)
          old = '''mod tests {
              use super::*;
              use phenix_kernel::{Kernel, KernelConfig, LocalPersistence, PluginState};
          '''
          new = '''mod tests {
              use super::*;
              use crate::{execution_factory, execution_manifest, ExecutionAuthority};
              use phenix_kernel::{Kernel, KernelConfig, LocalPersistence, PluginState};
          '''
          if old not in text:
              raise SystemExit("context test import anchor missing")
          context.write_text(text.replace(old, new, 1))

          hooks = Path("rust/crates/phenix-plugin-suite/src/hooks.rs")
          text = hooks.read_text()
          text = text.replace(
              "handle_failure(&hook, message, &mut dispatch)?;",
              "handle_failure(hook, message, &mut dispatch)?;",
          )
          hooks.write_text(text)

          repository_workers = Path("rust/crates/phenix-plugin-suite/src/repository_workers.rs")
          text = repository_workers.read_text()
          pattern = re.compile(
              r'\} else if let Some\(rest\) = trimmed\.strip_prefix\("- \[ \] "\) \{\n'
              r'(?P<indent>\s+)\(false, rest\)\n'
              r'\s+\} else \{\n'
              r'\s+return None;\n'
              r'\s+\};'
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit("repository worker checkbox parser Clippy anchor missing")
          indent = match.group("indent")
          replacement = (
              '} else {\n'
              f'{indent}let rest = trimmed.strip_prefix("- [ ] ")?;\n'
              f'{indent}(false, rest)\n'
              f'{indent[:-4]}}};'
          )
          repository_workers.write_text(pattern.sub(replacement, text, count=1))
          PY
          git add rust/crates/phenix-harness/src/main.rs
      - name: Apply canonical fixes
        run: nix run .#phenix-maintenance -- fix
      - name: Harness tests
        run: cargo test --manifest-path rust/Cargo.toml -p phenix-harness
      - name: Workspace Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Harness package
        run: nix build .#phenix-harness --no-link
      - name: Product smoke
        run: nix build .#checks.x86_64-linux.phenix-product-smoke --no-link
      - name: Clean transport files
        run: |
          rm .github/workflows/worker-399-harness-runtime.yml
          rm scripts/worker399_harness_runtime.py
          rm scripts/worker399_harness_runtime_fix.py
          git diff --check
      - name: Commit Harness runtime migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: make Harness the supported plugin runtime'
          git push origin HEAD:feat/plugin-kernel-implementation

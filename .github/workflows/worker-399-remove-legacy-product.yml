name: Worker 399 legacy product cleanup

on:
  push:
    branches:
      - feat/plugin-kernel-implementation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: feat/plugin-kernel-implementation
          fetch-depth: 0

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Remove legacy product export
        run: python scripts/worker_399_remove_legacy_product.py

      - name: Canonical fixes
        run: nix run .#phenix-maintenance -- fix

      - name: Verify supported product surface
        run: |
          set -euo pipefail
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          test "$(nix eval --raw --expr 'let f = builtins.getFlake (toString ./.); in if builtins.hasAttr "phenix-conductor" f.packages.'"$system"' then "present" else "absent"')" = absent
          test "$(nix eval --raw --expr 'let f = builtins.getFlake (toString ./.); in if builtins.hasAttr "phenix-conductor" f.apps.'"$system"' then "present" else "absent"')" = absent
          nix build --no-link --print-build-logs ".#packages.$system.phenix-kernel" ".#packages.$system.phenix-harness" ".#packages.$system.phenix"

      - name: Product and composition validation
        run: |
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          nix build --no-link --print-build-logs ".#checks.$system.phenix-product-smoke"
          nix build --no-link --print-build-logs ".#checks.$system.phenix-plugin-packaging"

      - name: Source validation
        run: |
          nix run .#phenix-maintenance -- check source
          git diff --check

      - name: Clean transport
        run: rm scripts/worker_399_remove_legacy_product.py .github/workflows/worker-399-remove-legacy-product.yml

      - name: Commit legacy product cleanup
        run: |
          set -euo pipefail
          git config user.name "Matthis Kälble"
          git config user.email "69082876+matthis-k@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: remove legacy conductor product export"
          git push origin HEAD:feat/plugin-kernel-implementation

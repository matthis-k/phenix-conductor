name: Worker 399 context execution provenance

on:
  push:
    branches:
      - feat/plugin-kernel-implementation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: feat/plugin-kernel-implementation
          fetch-depth: 0
      - name: Bind context injection to active executions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/worker399_context_execution.py
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo test --manifest-path rust/Cargo.toml -p phenix-plugin-suite --lib context::tests::
          cargo test --manifest-path rust/Cargo.toml -p phenix-harness --lib
          rm .github/workflows/worker-399-context-execution.yml
          rm scripts/worker399_context_execution.py
          git diff --check
      - name: Commit context execution provenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: bind context injection to active executions'
          git push origin HEAD:feat/plugin-kernel-implementation

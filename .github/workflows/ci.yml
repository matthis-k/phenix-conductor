          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto

      - name: "Nix formatting"
        run: nix run .#phenix-maintenance-command-fa944a2937b3 -- check source nix-format

      - name: "Rust formatting"
        run: nix run .#phenix-maintenance-command-31a6c0b16724 -- check source rust-format

      - name: "Statix"
        run: nix run .#phenix-maintenance-command-4ff10aceddac -- check source statix

      - name: "Actionlint"
        run: nix run .#phenix-maintenance-command-e0c2105ec1ec -- check source actionlint

      - name: "Test target classification"
        run: nix run .#phenix-maintenance-command-fe564e52f93c -- check source test-targets

      - name: "Generated workflow"
        run: nix run .#phenix-maintenance-command-9383b20a4494 -- check source workflow-sync

      - name: Repository remains clean
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"



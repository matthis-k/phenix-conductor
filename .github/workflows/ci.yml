# Generated by phenix-flake-ci. Edit the Nix maintenance declaration, not this file.
name: "CI"

on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: "Source"
    runs-on: "ubuntu-latest"
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto

      - name: "Nix formatting"
        run: nix run --quiet .#phenix-maintenance-command-fa944a2937b3 -- check source nix-format

      - name: "Rust formatting"
        run: nix run --quiet .#phenix-maintenance-command-31a6c0b16724 -- check source rust-format

      - name: "Statix"
        run: nix run --quiet .#phenix-maintenance-command-4ff10aceddac -- check source statix

      - name: "Actionlint"
        run: nix run --quiet .#phenix-maintenance-command-e0c2105ec1ec -- check source actionlint

      - name: "Plugin architecture"
        run: nix run --quiet .#phenix-maintenance-command-da4d8b6b0d46 -- check source plugin-architecture

      - name: "Structural boundaries"
        run: nix run --quiet .#phenix-maintenance-command-d0a2e91a2adf -- check source structural-boundaries

      - name: "Test target classification"
        run: nix run --quiet .#phenix-maintenance-command-fe564e52f93c -- check source test-targets

      - name: "Generated workflow"
        run: nix run --quiet .#phenix-maintenance-command-9383b20a4494 -- check source workflow-sync

      - name: "Clippy"
        run: nix run --quiet .#phenix-maintenance-command-ed54c0f878db -- check rust

      - name: Repository remains clean
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"


  ci:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: "CI"
    runs-on: "ubuntu-latest"
    timeout-minutes: 120
    needs:
      - source
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto

      - name: "CI"
        env:
          CARGO_HOME: "${{ runner.temp }}/phenix-cargo-home"
          CARGO_TARGET_DIR: "${{ runner.temp }}/phenix-cargo-target"
          CARGO_TERM_QUIET: "true"
        run: nix run --quiet .#phenix-maintenance-command-23bf0d244a4c -- pipeline

      - name: Repository remains clean
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"


  checks:
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    name: "Maintenance checks"
    needs:
      - source
      - ci
    runs-on: ubuntu-latest
    steps:
      - name: Verify all maintenance jobs passed
        run: |
          set -euo pipefail
          [[ '${{ needs.source.result }}' == success ]]
          [[ '${{ needs.ci.result }}' == success ]]

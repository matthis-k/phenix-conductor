name: Worker 399 full suite composition

on:
  push:
    branches:
      - feat/plugin-kernel-implementation

permissions:
  contents: write

jobs:
  compose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: feat/plugin-kernel-implementation
          fetch-depth: 0
      - name: Compose first-party userspace services
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          models = Path('rust/crates/phenix-plugin-suite/src/models.rs')
          text = models.read_text()
          old = '''#[must_use]\npub fn model_routing_manifest() -> PluginManifest {\n    PluginManifest {'''
          new = '''#[must_use]\npub fn model_routing_manifest(maximum_authority: Authority) -> PluginManifest {\n    let persistence = Authority::new([\n        capability(PERSISTENCE_SCHEMA),\n        capability(PERSISTENCE_READ),\n        capability(PERSISTENCE_WRITE),\n    ]);\n    let maximum_authority = Authority::new(\n        maximum_authority\n            .capabilities()\n            .cloned()\n            .chain(persistence.capabilities().cloned()),\n    );\n    PluginManifest {'''
          if old not in text and 'pub fn model_routing_manifest(maximum_authority: Authority)' not in text:
              raise SystemExit('model manifest marker missing')
          text = text.replace(old, new, 1)
          text = text.replace('''        maximum_authority: Authority::new([\n            capability(PERSISTENCE_SCHEMA),\n            capability(PERSISTENCE_READ),\n            capability(PERSISTENCE_WRITE),\n        ]),''', '''        maximum_authority,''', 1)
          text = text.replace('model_routing_manifest().maximum_authority', 'model_routing_manifest(Authority::default()).maximum_authority')
          text = text.replace('let manifest = model_routing_manifest();', 'let manifest = model_routing_manifest(Authority::default());')
          models.write_text(text)

          lib = Path('rust/crates/phenix-plugin-suite/src/lib.rs')
          text = lib.read_text()
          for anchor, module in [
              ('mod context;\n', 'mod debug;\n'),
              ('mod execution;\n', 'mod frontend;\n'),
              ('mod frontend;\n', 'mod hooks;\n'),
              ('mod hooks;\n', 'mod jobs;\n'),
              ('mod language;\n', 'mod models;\n'),
              ('mod sessions;\n', 'mod workspace;\n'),
          ]:
              if module not in text:
                  if anchor not in text:
                      raise SystemExit(f'module anchor missing: {anchor!r}')
                  text = text.replace(anchor, anchor + module, 1)
          export_anchor = '''pub use context::{\n    context_factory, context_manifest, context_service, ContextCommand, ContextDescriptor,\n    ContextInjection, ContextInjectionLifetime, ContextInjectionRequester, ContextResourceKind,\n    ContextResourceRevision, ContextResponse, ContextScope, ExactContextReference,\n    ExecutionContextProjection, ProjectedContextEntry, RepositoryContextSource, CONTEXT_SERVICE,\n};\n'''
          exports = export_anchor + '''pub use debug::{\n    debug_factory, debug_manifest, debug_service, DebugCommand, DebugResponse, DiagnosticEntry,\n    DiagnosticSnapshot, DEBUG_SERVICE,\n};\n'''
          if 'pub use debug::' not in text:
              if export_anchor not in text:
                  raise SystemExit('debug export anchor missing')
              text = text.replace(export_anchor, exports, 1)
          execution_anchor = '''pub use execution::{\n    execution_factory, execution_manifest, execution_service, CallableRecord, ExecutionAuthority,\n    ExecutionCommand, ExecutionRecord, ExecutionResponse, ExecutionState, WorkerTaskRecord,\n    WorkerTaskState, EXECUTION_SERVICE,\n};\n'''
          extra = execution_anchor + '''pub use frontend::{\n    frontend_factory, frontend_manifest, frontend_service, FrontendCommand, FrontendProviderDescriptor,\n    FrontendResponse, FrontendServiceRequest, FrontendServiceResult, LiveFrontendProvider,\n    FRONTEND_SERVICE,\n};\npub use hooks::{\n    hook_factory, hook_manifest, hook_service, HookAction, HookCommand, HookConfiguration,\n    HookDefinition, HookDispatch, HookFailurePolicy, HookResponse, HookWarning, LifecycleEvent,\n    HOOK_SERVICE,\n};\npub use jobs::{\n    job_factory, job_manifest, job_service, JobCommand, JobResponse, RuntimeResourceKind,\n    RuntimeResourceRecord, RuntimeResourceState, JOB_SERVICE,\n};\n'''
          if 'pub use frontend::' not in text:
              if execution_anchor not in text:
                  raise SystemExit('frontend export anchor missing')
              text = text.replace(execution_anchor, extra, 1)
          language_anchor = '''pub use language::{\n    language_factory, language_manifest, language_service, DocumentProvenance, LanguageCommand,\n    LanguageDocumentIdentity, LanguageObservation, LanguageOperationKind, LanguageOperationResult,\n    LanguageProviderEpoch, LanguageResponse, LANGUAGE_SERVICE,\n};\n'''
          extra = language_anchor + '''pub use models::{\n    model_inference_service, model_routing_factory, model_routing_manifest, model_routing_service,\n    ModelCommand, ModelInferenceRequest, ModelInferenceResponse, ModelResponse, ModelTarget,\n    RoutingProfile, RoutingProfileDescriptor, MODEL_INFERENCE_SERVICE, MODEL_ROUTING_SERVICE,\n};\n'''
          if 'pub use models::' not in text:
              if language_anchor not in text:
                  raise SystemExit('models export anchor missing')
              text = text.replace(language_anchor, extra, 1)
          session_anchor = '''pub use sessions::{\n    session_factory, session_manifest, session_service, SessionCommand, SessionRecord,\n    SessionResponse, SESSION_SERVICE,\n};\n'''
          extra = session_anchor + '''pub use workspace::{\n    workspace_factory, workspace_factory_for, workspace_manifest, workspace_service,\n    WorkspaceCommand, WorkspaceFileVersion, WorkspaceResponse, WorkspaceSearchMatch,\n    WORKSPACE_SERVICE,\n};\n'''
          if 'pub use workspace::' not in text:
              if session_anchor not in text:
                  raise SystemExit('workspace export anchor missing')
              text = text.replace(session_anchor, extra, 1)
          lib.write_text(text)

          harness = Path('rust/crates/phenix-harness/src/lib.rs')
          text = harness.read_text()
          old = '''use phenix_kernel::{\n    Authority, Kernel, KernelConfig, KernelError, PluginExecution, PluginId, PluginInstance,\n    PluginManifest,\n};'''
          new = '''use phenix_kernel::{\n    Authority, CapabilityId, Kernel, KernelConfig, KernelError, PluginExecution, PluginId,\n    PluginInstance, PluginManifest,\n};'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'CapabilityId' not in text.split('};', 1)[0]:
              raise SystemExit('harness kernel import marker missing')
          old = '''use phenix_plugin_suite::{\n    artifact_factory, artifact_manifest, context_factory, context_manifest, execution_factory,\n    execution_manifest, language_factory, language_manifest, planning_factory, planning_manifest,\n    repository_worker_factory, repository_worker_manifest, session_factory, session_manifest,\n};'''
          new = '''use phenix_plugin_suite::{\n    artifact_factory, artifact_manifest, context_factory, context_manifest, debug_factory,\n    debug_manifest, execution_factory, execution_manifest, frontend_factory, frontend_manifest,\n    hook_factory, hook_manifest, job_factory, job_manifest, language_factory, language_manifest,\n    model_routing_factory, model_routing_manifest, planning_factory, planning_manifest,\n    repository_worker_factory, repository_worker_manifest, session_factory, session_manifest,\n    workspace_factory, workspace_manifest,\n};'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'workspace_factory' not in text:
              raise SystemExit('harness suite import marker missing')

          marker = '''type EmbeddedFactory = Arc<dyn Fn() -> Box<dyn PluginInstance> + Send + Sync>;\n'''
          helper = marker + '''\nfn default_suite_authority() -> Authority {\n    Authority::new([\n        CapabilityId::parse("kernel.persistence.schema").expect("static capability"),\n        CapabilityId::parse("kernel.persistence.read").expect("static capability"),\n        CapabilityId::parse("kernel.persistence.write").expect("static capability"),\n        CapabilityId::parse("workspace.read").expect("static capability"),\n        CapabilityId::parse("workspace.write").expect("static capability"),\n        CapabilityId::parse("workspace.shell").expect("static capability"),\n        CapabilityId::parse("workspace.git").expect("static capability"),\n    ])\n}\n'''
          if 'fn default_suite_authority()' not in text:
              if marker not in text:
                  raise SystemExit('suite authority insertion marker missing')
              text = text.replace(marker, helper, 1)

          old = '''        builder.add_embedded(repository_worker_manifest(), repository_worker_factory)?;\n        builder.add_embedded(session_manifest(), session_factory)?;\n        builder.add_embedded(artifact_manifest(), artifact_factory)?;\n        builder.add_embedded(context_manifest(), context_factory)?;\n        builder.add_embedded(execution_manifest(Authority::default()), execution_factory)?;\n        builder.add_embedded(language_manifest(), language_factory)?;\n        builder.add_embedded(planning_manifest(), planning_factory)?;\n        Ok(builder)'''
          new = '''        let authority = default_suite_authority();\n        builder.add_embedded(repository_worker_manifest(), repository_worker_factory)?;\n        builder.add_embedded(session_manifest(), session_factory)?;\n        builder.add_embedded(artifact_manifest(), artifact_factory)?;\n        builder.add_embedded(context_manifest(), context_factory)?;\n        builder.add_embedded(execution_manifest(authority.clone()), execution_factory)?;\n        builder.add_embedded(language_manifest(), language_factory)?;\n        builder.add_embedded(planning_manifest(), planning_factory)?;\n        builder.add_embedded(workspace_manifest(), workspace_factory)?;\n        builder.add_embedded(model_routing_manifest(authority.clone()), model_routing_factory)?;\n        builder.add_embedded(job_manifest(), job_factory)?;\n        builder.add_embedded(frontend_manifest(authority.clone()), frontend_factory)?;\n        builder.add_embedded(hook_manifest(authority.clone()), hook_factory)?;\n        builder.add_embedded(debug_manifest(authority), debug_factory)?;\n        Ok(builder)'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'builder.add_embedded(debug_manifest' not in text:
              raise SystemExit('default suite composition marker missing')
          text = text.replace('assert_eq!(harness.kernel().config().manifests().count(), 7);', 'assert_eq!(harness.kernel().config().manifests().count(), 13);')
          harness.write_text(text)
          PY
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo test --manifest-path rust/Cargo.toml -p phenix-plugin-suite --lib
          cargo test --manifest-path rust/Cargo.toml -p phenix-harness --lib
          rm .github/workflows/worker-399-suite-compose.yml
          git diff --check
      - name: Commit composed suite
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: compose first-party plugin suite services'
          git push origin HEAD:feat/plugin-kernel-implementation

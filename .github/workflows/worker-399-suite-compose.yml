name: Worker 399 full suite composition

on:
  push:
    branches:
      - feat/plugin-kernel-implementation

permissions:
  contents: write

jobs:
  compose:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: feat/plugin-kernel-implementation
          fetch-depth: 0
      - name: Compose first-party userspace services
        shell: bash
        run: |
          set -euo pipefail
          python scripts/worker399_suite_compose.py
          cargo fmt --manifest-path rust/Cargo.toml --all
          rm .github/workflows/worker-399-suite-compose.yml
          rm scripts/worker399_suite_compose.py
          git diff --check
      - name: Commit composed suite
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: compose first-party plugin suite services'
          git push origin HEAD:feat/plugin-kernel-implementation

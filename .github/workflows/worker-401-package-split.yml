name: Worker 401 package split

on:
  push:
    branches:
      - architecture/phenix-ai-repository-boundary

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: architecture/phenix-ai-repository-boundary
          fetch-depth: 0
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Split first-party plugins and import Harness resources
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/matthis-k/phenix-harness.git "$RUNNER_TEMP/phenix-harness"
          mkdir -p config/phenix-harness
          cp "$RUNNER_TEMP/phenix-harness/config/phenix/runtime.nix" config/phenix-harness/runtime.nix
          rm -rf config/phenix-harness/skills
          cp -a "$RUNNER_TEMP/phenix-harness/config/phenix/skills" config/phenix-harness/skills
          python - <<'PY'
          from pathlib import Path
          modules = ["artifacts","cli","context","debug","execution","frontend","hooks","jobs","language","models","planning","repository_workers","sessions","workspace"]
          edges = {
              "cli": ["workspace"],
              "context": ["execution"],
              "frontend": ["execution"],
              "hooks": ["context", "execution"],
              "debug": ["context", "frontend", "jobs", "models", "planning", "sessions"],
          }
          replacements = {
              "cli": [("use crate::{workspace_service, WorkspaceCommand, WorkspaceResponse};", "use phenix_plugin_workspace::{workspace_service, WorkspaceCommand, WorkspaceResponse};")],
              "context": [("use crate::{execution_service, ExecutionCommand, ExecutionResponse, ExecutionState};", "use phenix_plugin_execution::{execution_service, ExecutionCommand, ExecutionResponse, ExecutionState};")],
              "frontend": [("use crate::{execution_service, ExecutionCommand, ExecutionResponse, ExecutionState};", "use phenix_plugin_execution::{execution_service, ExecutionCommand, ExecutionResponse, ExecutionState};")],
              "hooks": [("use crate::{\n    context_service, execution_service, ContextCommand, ContextInjectionLifetime,\n    ContextInjectionRequester, ExecutionCommand, ExecutionResponse,\n};", "use phenix_plugin_context::{context_service, ContextCommand, ContextInjectionLifetime, ContextInjectionRequester};\nuse phenix_plugin_execution::{execution_service, ExecutionCommand, ExecutionResponse};")],
              "debug": [("use crate::{\n    context_service, frontend_service, job_service, model_routing_service, planning_service,\n    session_service, ContextCommand, FrontendCommand, JobCommand, ModelCommand, PlanningCommand,\n    SessionCommand,\n};", "use phenix_plugin_context::{context_service, ContextCommand};\nuse phenix_plugin_frontend::{frontend_service, FrontendCommand};\nuse phenix_plugin_jobs::{job_service, JobCommand};\nuse phenix_plugin_models::{model_routing_service, ModelCommand};\nuse phenix_plugin_planning::{planning_service, PlanningCommand};\nuse phenix_plugin_sessions::{session_service, SessionCommand};")],
          }
          root = Path("rust/crates")
          suite = root / "phenix-plugin-suite"
          for module in modules:
              package = "phenix-plugin-" + module.replace("_", "-")
              crate = root / package
              (crate / "src").mkdir(parents=True, exist_ok=True)
              source = (suite / "src" / f"{module}.rs").read_text()
              for old, new in replacements.get(module, []):
                  if old not in source:
                      raise SystemExit(f"expected import not found in {module}")
                  source = source.replace(old, new, 1)
              (crate / "src" / "lib.rs").write_text(source)
              deps = [
                  "[package]", f'name = "{package}"', 'version = "0.1.0"', 'edition = "2021"', 'publish = false', "", "[dependencies]",
                  'phenix-kernel = { path = "../phenix-kernel" }', "serde.workspace = true", "serde_json.workspace = true", "sha2.workspace = true",
              ]
              for dep in edges.get(module, []):
                  dep_package = "phenix-plugin-" + dep.replace("_", "-")
                  deps.append(f'{dep_package} = {{ path = "../{dep_package}" }}')
              (crate / "Cargo.toml").write_text("\n".join(deps) + "\n")
          cargo = Path("rust/Cargo.toml")
          text = cargo.read_text()
          for module in modules:
              member = f'  "crates/phenix-plugin-{module.replace("_", "-")}",\n'
              if member not in text:
                  text = text.replace('  "crates/phenix-plugin-suite",\n', '  "crates/phenix-plugin-suite",\n' + member)
          cargo.write_text(text)
          deps = ["[package]", 'name = "phenix-plugin-suite"', 'version = "0.1.0"', 'edition = "2021"', 'publish = false', "", "[dependencies]", 'phenix-kernel = { path = "../phenix-kernel" }', "serde_json.workspace = true"]
          for module in modules:
              package = "phenix-plugin-" + module.replace("_", "-")
              deps.append(f'{package} = {{ path = "../{package}" }}')
          (suite / "Cargo.toml").write_text("\n".join(deps) + "\n")
          old_lib = (suite / "src" / "lib.rs").read_text()
          tail = old_lib[old_lib.index("use phenix_kernel::{"):]
          exports = ["#![forbid(unsafe_code)]", ""] + [f"pub use phenix_plugin_{m}::*;" for m in modules] + ["", tail]
          (suite / "src" / "lib.rs").write_text("\n".join(exports))
          for module in modules:
              (suite / "src" / f"{module}.rs").unlink()
          PY
          (cd rust && cargo generate-lockfile)
          nix run .#phenix-maintenance -- fix
      - name: Validate imported resources
        run: |
          test -f config/phenix-harness/runtime.nix
          test -f config/phenix-harness/skills/write/SKILL.md
          test -f config/phenix-harness/skills/pstack-LICENSE
      - name: Validate Source
        run: nix run .#phenix-maintenance -- check source
      - name: Validate Rust
        run: nix run .#phenix-maintenance -- check rust
      - name: Validate unit tests
        run: nix run .#phenix-maintenance -- test unit
      - name: Validate Product
        run: nix run .#phenix-maintenance -- test product
      - name: Commit semantic migration
        run: |
          set -euo pipefail
          rm .github/workflows/worker-401-package-split.yml
          rm -f .github/worker-401-rust-tail.log .github/worker-401-rust.log
          git config user.name matthis-k
          git config user.email 69082876+matthis-k@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'refactor: split first-party plugin packages'
          git push origin HEAD:architecture/phenix-ai-repository-boundary

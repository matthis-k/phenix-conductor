name: Worker 399 host authority transport

on:
  push:
    branches:
      - feat/plugin-kernel-implementation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: feat/plugin-kernel-implementation

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Apply and validate host authority transform
        run: |
          set -euo pipefail
          python3 .github/worker-399-host-authority.py
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo test --manifest-path rust/Cargo.toml -p phenix-kernel --lib
          git diff --check
          rm .github/worker-399-host-authority.py
          rm .github/workflows/worker-399-host-authority.yml

      - name: Commit semantic tree
        env:
          HEAD_REF: feat/plugin-kernel-implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: enforce host delegation authority"
          git push origin "HEAD:$HEAD_REF"

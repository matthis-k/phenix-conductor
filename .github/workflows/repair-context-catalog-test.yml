name: Repair context catalog test

on:
  push:
    branches:
      - context-07-context-catalog-implementation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: context-07-context-catalog-implementation
          fetch-depth: 0

      - name: Apply repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('rust/crates/phenix-conductor/tests/context_catalog_injection.rs')
          text = path.read_text()
          old = '    assert_eq!(injection.source_ref, ExactReference::Context(id));\n'
          new = '''    assert_eq!(\n        injection.source_ref,\n        ExactReference::Context {\n            resource_id: id,\n            revision: resource.descriptor.revision.clone(),\n        }\n    );\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale Context constructor, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY

          cargo fmt --all --manifest-path rust/Cargo.toml
          git diff --check
          git rm .github/workflows/repair-context-catalog-test.yml
          git add rust/crates/phenix-conductor/tests/context_catalog_injection.rs
          git config user.name "Matthis Kälble"
          git config user.email "69082876+matthis-k@users.noreply.github.com"
          git commit -m "fix: migrate context injection assertion"
          git push origin HEAD:context-07-context-catalog-implementation

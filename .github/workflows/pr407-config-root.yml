name: PR 407 config root

on:
  push:
    branches:
      - agent/plugin-sdk-contributions

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: agent/plugin-sdk-contributions
      - name: Apply config root wiring
        run: python3 .github/pr407_config_patch.py
      - name: Format Rust
        run: cargo fmt --manifest-path rust/Cargo.toml --all
      - name: Commit changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name phenix-worker
          git config user.email phenix-worker@users.noreply.github.com
          git add modules rust spec
          git commit -m 'feat: load scoped settings from config directory'
          git push origin HEAD:agent/plugin-sdk-contributions

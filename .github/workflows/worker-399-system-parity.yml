name: Worker 399 Harness system parity

on:
  push:
    branches:
      - feat/plugin-kernel-implementation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: feat/plugin-kernel-implementation
          fetch-depth: 0

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Apply Harness system parity
        run: python scripts/harness_system_parity_transport.py

      - name: Canonical fixes
        run: nix run .#phenix-maintenance -- fix

      - name: Focused Harness system target
        run: nix run .#phenix-maintenance -- test system harness-supported-product

      - name: Harness and workspace validation
        run: |
          cd rust
          cargo test --locked -p phenix-harness
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Product smoke
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.phenix-product-smoke

      - name: Source validation
        run: |
          nix run .#phenix-maintenance -- check source
          git diff --check

      - name: Clean transport
        run: rm scripts/harness_system_parity_transport.py .github/workflows/worker-399-system-parity.yml

      - name: Commit Harness system parity
        run: |
          set -euo pipefail
          git config user.name "Matthis Kälble"
          git config user.email "69082876+matthis-k@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: validate supported Harness in system graph"
          git push origin HEAD:feat/plugin-kernel-implementation

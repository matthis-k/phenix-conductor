name: Worker 399 linked suite selection

on:
  push:
    branches:
      - feat/plugin-kernel-implementation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: feat/plugin-kernel-implementation
          fetch-depth: 0

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Apply linked suite selection
        run: python scripts/plugin_suite_selection_transport.py

      - name: Canonical fixes
        run: nix run .#phenix-maintenance -- fix

      - name: Harness tests
        run: |
          cd rust
          cargo test --locked -p phenix-harness

      - name: Workspace Clippy
        run: |
          cd rust
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Nix composition regression
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.phenix-plugin-packaging

      - name: Product smoke
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.phenix-product-smoke

      - name: Source validation
        run: |
          nix run .#phenix-maintenance -- check source
          git diff --check

      - name: Clean transport
        run: rm scripts/plugin_suite_selection_transport.py .github/workflows/worker-399-suite-selection.yml

      - name: Commit suite selection
        run: |
          set -euo pipefail
          git config user.name "Matthis Kälble"
          git config user.email "69082876+matthis-k@users.noreply.github.com"
          git add -A
          git commit -m "feat: select linked Plugin Suite services through Harness policy"
          git push origin HEAD:feat/plugin-kernel-implementation

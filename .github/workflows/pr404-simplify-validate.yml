name: PR 404 simplification validation

on:
  push:
    branches:
      - tmp/pr404-simplify-validated
    paths:
      - .github/workflows/pr404-simplify-validate.yml

permissions:
  contents: write

jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: tmp/pr404-simplify-validated
          fetch-depth: 0
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto
      - name: Apply simplifications
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          # KernelConfig already owns layer policies. Expose a crate-private view
          # and derive the ResolvedHarness view instead of storing a second copy.
          path = Path("rust/crates/phenix-core/src/registry.rs")
          text = path.read_text()
          anchor = "\n    pub fn resolve_chain("
          accessor = (
              "\n    pub(crate) fn layer_policies(&self) -> &BTreeMap<ServiceId, Vec<LayerPolicy>> {\n"
              "        &self.layer_policies\n"
              "    }\n"
          )
          text = replace_once(text, anchor, accessor + anchor, "KernelConfig layer policy view")
          path.write_text(text)

          path = Path("rust/crates/phenix-core/src/resolver.rs")
          text = path.read_text()
          text = replace_once(
              text,
              "    layer_policies: BTreeMap<ServiceId, Vec<LayerPolicy>>,\n",
              "",
              "ResolvedHarness duplicate layer policy field",
          )
          text = replace_once(
              text,
              "            layer_policies,\n",
              "",
              "ResolvedHarness duplicate layer policy init",
          )
          old = (
              "    pub fn layer_policies(&self) -> &BTreeMap<ServiceId, Vec<LayerPolicy>> {\n"
              "        &self.layer_policies\n"
              "    }\n"
          )
          new = (
              "    pub fn layer_policies(&self) -> &BTreeMap<ServiceId, Vec<LayerPolicy>> {\n"
              "        self.kernel_config.layer_policies()\n"
              "    }\n"
          )
          text = replace_once(text, old, new, "ResolvedHarness derived layer policy view")
          path.write_text(text)

          # ResolvedHarness is already the canonical resolver. Remove forwarding
          # helpers that only duplicate its three entry points.
          path = Path("rust/crates/phenix-core/src/reconciliation.rs")
          text = path.read_text()
          start = text.index("    pub fn resolve_candidate(")
          end = text.index("    pub fn preview_candidate(&self", start)
          text = text[:start] + text[end:]
          for old, new, label in [
              ("Self::resolve_candidate(", "ResolvedHarness::resolve(", "plain reconciliation"),
              ("Self::resolve_candidate_with_resources(", "ResolvedHarness::resolve_with_resources(", "resource reconciliation"),
              ("Self::resolve_frontend_candidate(", "ResolvedHarness::resolve_frontends(", "frontend reconciliation"),
          ]:
              text = replace_once(text, old, new, label)
          path.write_text(text)

          # InvocationTrace already has the service identity in planned_chain.
          path = Path("rust/crates/phenix-core/src/runtime.rs")
          text = path.read_text()
          start = text.index("struct InvocationTrace {")
          end = text.index("\n}\n", start)
          block = text[start:end]
          block = replace_once(block, "    service: ServiceId,\n", "", "InvocationTrace service field")
          text = text[:start] + block + text[end:]
          text = replace_once(
              text,
              "            service: chain.service.clone(),\n",
              "",
              "InvocationTrace service init",
          )
          text = replace_once(
              text,
              "            service: self.service,\n",
              "            service: self.planned_chain.service.clone(),\n",
              "InvocationTrace service projection",
          )
          path.write_text(text)

          # Core owns these primitive service identities. First-party plugins
          # should re-export them, as the sessions plugin already does.
          path = Path("rust/crates/phenix-plugin-models/src/implementation.rs")
          text = path.read_text()
          text = replace_once(
              text,
              "pub use phenix_core::{ModelInferenceRequest, ModelInferenceResponse};\n",
              "pub use phenix_core::{\n    model_inference_service, ModelInferenceRequest, ModelInferenceResponse,\n    MODEL_INFERENCE_SERVICE,\n};\n",
              "model primitive re-export",
          )
          text = replace_once(
              text,
              'pub const MODEL_INFERENCE_SERVICE: &str = "phenix.models.inference@1";\n',
              "",
              "duplicate model service constant",
          )
          helper = "#[must_use]\npub fn model_inference_service() -> ServiceId {"
          start = text.index(helper)
          end = text.index("\n}\n", start) + len("\n}\n")
          text = text[:start] + text[end:]
          path.write_text(text)

          path = Path("rust/crates/phenix-plugin-context/src/implementation.rs")
          text = path.read_text()
          text = replace_once(
              text,
              "pub use phenix_core::{\n    ContextDescriptor, ContextResourceKind, ContextResourceRevision, ContextScope,\n};\n",
              "pub use phenix_core::{\n    context_service, ContextDescriptor, ContextResourceKind, ContextResourceRevision,\n    ContextScope, CONTEXT_SERVICE,\n};\n",
              "context primitive re-export",
          )
          text = replace_once(
              text,
              'pub const CONTEXT_SERVICE: &str = "phenix.context@1";\n',
              "",
              "duplicate context service constant",
          )
          helper = "#[must_use]\npub fn context_service() -> ServiceId {"
          start = text.index(helper)
          end = text.index("\n}\n", start) + len("\n}\n")
          text = text[:start] + text[end:]
          path.write_text(text)
          PY
      - name: Validate simplifications
        shell: bash
        run: |
          set -euo pipefail
          nix run .#phenix-maintenance -- fix
          nix run .#phenix-maintenance -- rust-ci clippy
          nix run .#phenix-maintenance -- rust-ci unit
          nix run .#phenix-maintenance -- rust-ci integration
          git diff --check
      - name: Publish validated tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr404-simplify-validate.yml
          git add -A
          git config user.name "phenix-worker"
          git config user.email "phenix-worker@users.noreply.github.com"
          git commit -m "refactor: derive resolved composition state"
          git push origin HEAD:tmp/pr404-simplify-validated

name: PR 407 settings integration patch

on:
  push:
    branches:
      - agent/plugin-sdk-contributions

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: agent/plugin-sdk-contributions
      - run: python3 .github/pr407_add_settings_test.py
      - run: nixfmt modules/plugin-packaging.nix
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name phenix-worker
          git config user.email phenix-worker@users.noreply.github.com
          git add modules/plugin-packaging.nix
          git commit -m 'test: cover Nix settings and SDK config reads'
          git push origin HEAD:agent/plugin-sdk-contributions

name: Worker 399 runtime plugin composition

on:
  push:
    branches:
      - feat/plugin-kernel-implementation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: feat/plugin-kernel-implementation
          fetch-depth: 0

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Apply runtime composition
        run: |
          python scripts/plugin_composition_transport.py
          python -c 'from pathlib import Path; p=Path("modules/plugin-packaging.nix"); s=p.read_text(); old=".id == \\"fixture.external\\" and .execution == \\"external\\""; new=".id == \\"fixture.session-replacement\\" and .execution == \\"external\\""; assert s.count(old) == 1; p.write_text(s.replace(old, new, 1))'

      - name: Add manifest-path diagnostic
        run: |
          python -c 'from pathlib import Path; p=Path("rust/crates/phenix-harness/src/main.rs"); s=p.read_text(); old="        .ok_or(\"plugin manifest must be a JSON object\")?;"; new="        .ok_or_else(|| format!(\"plugin manifest {} must be a JSON object: {value}\", manifest_path.display()))?;"; assert old in s; p.write_text(s.replace(old,new,1))'

      - name: Runtime composition check
        id: composition
        continue-on-error: true
        run: |
          set -o pipefail
          nix build --no-link --print-build-logs .#checks.x86_64-linux.phenix-plugin-packaging 2>&1 | tee /tmp/phenix-plugin-packaging.log

      - name: Prepare runtime composition diagnostic
        if: steps.composition.outcome == 'failure'
        run: tail -n 280 /tmp/phenix-plugin-packaging.log > worker-399-runtime-composition.txt

      - name: Upload runtime composition diagnostic
        if: steps.composition.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: worker-399-runtime-composition
          path: worker-399-runtime-composition.txt

      - name: Fail runtime composition diagnostic run
        if: steps.composition.outcome == 'failure'
        run: exit 1

      - name: Apply canonical fixes
        if: steps.composition.outcome == 'success'
        run: nix run .#phenix-maintenance -- fix

      - name: Harness tests
        if: steps.composition.outcome == 'success'
        run: |
          cd rust
          cargo test --locked -p phenix-harness

      - name: Workspace Clippy
        if: steps.composition.outcome == 'success'
        run: |
          cd rust
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Product smoke
        if: steps.composition.outcome == 'success'
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.phenix-plugin-suite-smoke

      - name: Validate source
        if: steps.composition.outcome == 'success'
        run: |
          nix run .#phenix-maintenance -- check source
          git diff --check

      - name: Clean transport
        if: steps.composition.outcome == 'success'
        run: rm .github/workflows/worker-399-runtime-composition.yml scripts/plugin_composition_transport.py

      - name: Commit runtime composition
        if: steps.composition.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "Matthis Kälble"
          git config user.email "69082876+matthis-k@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: compose Nix-selected plugins at Harness runtime"
          git push origin HEAD:feat/plugin-kernel-implementation
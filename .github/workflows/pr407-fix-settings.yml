name: PR 407 settings fix

on:
  push:
    branches:
      - agent/plugin-sdk-contributions

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: agent/plugin-sdk-contributions
      - run: python3 .github/pr407_fix_settings.py
      - run: cargo fmt --manifest-path rust/Cargo.toml --all
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name phenix-worker
          git config user.email phenix-worker@users.noreply.github.com
          git add rust
          git commit -m 'fix: parse settings into typed option overrides'
          git push origin HEAD:agent/plugin-sdk-contributions

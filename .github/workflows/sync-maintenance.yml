name: Maintenance autofix

on:
  pull_request:

permissions:
  actions: write
  contents: write

jobs:
  autofix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Generate workspace lockfile
        run: |
          set -euo pipefail
          set +e
          (
            cd rust
            nix run nixpkgs#cargo -- check --workspace --all-targets
          )
          cargo_status=$?
          set -e
          if git diff --quiet -- rust/Cargo.lock; then
            echo "Cargo did not update rust/Cargo.lock (cargo exit $cargo_status)" >&2
            exit 1
          fi
          git diff --check -- rust/Cargo.lock

      - name: Commit lockfile through contents API
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/rust/Cargo.lock?ref=$HEAD_REF" --jq .sha)
          content=$(base64 -w0 rust/Cargo.lock)
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/rust/Cargo.lock" \
            -f message='fix: update Rust workspace lockfile' \
            -f branch="$HEAD_REF" \
            -f sha="$sha" \
            -f content="$content" >/dev/null

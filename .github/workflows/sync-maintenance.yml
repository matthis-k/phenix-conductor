name: Maintenance autofix

on:
  pull_request:

permissions:
  actions: write
  contents: write

jobs:
  autofix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Apply Nix runtime composition transport
        run: |
          set -euo pipefail
          python scripts/plugin_composition_transport.py
          nix run .#phenix-maintenance -- fix
          git diff --check

      - name: Validate Harness suite selection
        run: |
          set -euo pipefail
          nix develop --command cargo test --manifest-path rust/Cargo.toml -p phenix-harness

      - name: Validate runtime-backed plugin packaging
        run: |
          set -euo pipefail
          nix build .#checks.x86_64-linux.phenix-plugin-packaging --no-link

      - name: Commit semantic composition change
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm scripts/plugin_composition_transport.py
          git checkout origin/main -- .github/workflows/sync-maintenance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: make Nix suite selection affect Harness runtime"
          git push origin "HEAD:$HEAD_REF"

      - name: Validate corrected head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: gh workflow run ci.yml --ref "$HEAD_REF"

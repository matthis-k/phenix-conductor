name: worker-404-simplify-derived

on:
  push:
    branches:
      - feat/layered-service-overrides
    paths:
      - .github/workflows/worker-404-simplify-derived.yml

permissions:
  contents: write

jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Apply simplifications
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          # KernelConfig already owns layer policy; ResolvedHarness should derive it.
          path = Path("rust/crates/phenix-core/src/registry.rs")
          text = path.read_text()
          marker = """    pub fn layer_policy(&self, service: &ServiceId) -> &[LayerPolicy] {
              self.layer_policies
                  .get(service)
                  .map(Vec::as_slice)
                  .unwrap_or_default()
          }
          """
          text = replace_once(
              text,
              marker,
              marker + """
          pub fn layer_policies(&self) -> &BTreeMap<ServiceId, Vec<LayerPolicy>> {
              &self.layer_policies
          }
          """,
              "KernelConfig layer policy view",
          )
          path.write_text(text)

          path = Path("rust/crates/phenix-core/src/resolver.rs")
          text = path.read_text()
          text = replace_once(
              text,
              """    kernel_config: KernelConfig,
              component_graph: ResolvedComponentGraph,
              layer_policies: BTreeMap<ServiceId, Vec<LayerPolicy>>,
          """,
              """    kernel_config: KernelConfig,
              component_graph: ResolvedComponentGraph,
          """,
              "ResolvedHarness duplicate layer policies field",
          )
          text = replace_once(
              text,
              """            kernel_config,
              component_graph,
              layer_policies,
          """,
              """            kernel_config,
              component_graph,
          """,
              "ResolvedHarness duplicate layer policies init",
          )
          text = replace_once(
              text,
              """    pub fn layer_policies(&self) -> &BTreeMap<ServiceId, Vec<LayerPolicy>> {
              &self.layer_policies
          }
          """,
              """    pub fn layer_policies(&self) -> &BTreeMap<ServiceId, Vec<LayerPolicy>> {
              self.kernel_config.layer_policies()
          }
          """,
              "ResolvedHarness derived layer policies getter",
          )
          path.write_text(text)

          # ResolvedHarness is the canonical candidate resolver; delete forwarding shims.
          path = Path("rust/crates/phenix-core/src/reconciliation.rs")
          text = path.read_text()
          start = text.index("    pub fn resolve_candidate(")
          end = text.index("    pub fn preview_candidate(&self", start)
          text = text[:start] + text[end:]
          text = replace_once(
              text,
              "let candidate = Self::resolve_candidate(\n",
              "let candidate = ResolvedHarness::resolve(\n",
              "reconcile candidate",
          )
          text = replace_once(
              text,
              "let candidate = Self::resolve_candidate_with_resources(\n",
              "let candidate = ResolvedHarness::resolve_with_resources(\n",
              "reconcile resource candidate",
          )
          text = replace_once(
              text,
              "let candidate = Self::resolve_frontend_candidate(\n",
              "let candidate = ResolvedHarness::resolve_frontends(\n",
              "reconcile frontend candidate",
          )
          path.write_text(text)

          # InvocationTrace already has the service in its resolved chain.
          path = Path("rust/crates/phenix-core/src/runtime.rs")
          text = path.read_text()
          text = replace_once(
              text,
              """struct InvocationTrace {
              graph_generation: Option<GraphGenerationId>,
              service: ServiceId,
              planned_chain: ResolvedServiceChain,
          """,
              """struct InvocationTrace {
              graph_generation: Option<GraphGenerationId>,
              planned_chain: ResolvedServiceChain,
          """,
              "InvocationTrace duplicate service field",
          )
          text = replace_once(
              text,
              """        Self {
                  graph_generation: graph_generation.cloned(),
                  service: chain.service.clone(),
                  planned_chain: chain.clone(),
          """,
              """        Self {
                  graph_generation: graph_generation.cloned(),
                  planned_chain: chain.clone(),
          """,
              "InvocationTrace duplicate service init",
          )
          text = replace_once(
              text,
              "            service: self.service,\n",
              "            service: self.planned_chain.service.clone(),\n",
              "InvocationTrace derived service output",
          )
          path.write_text(text)

          # Reuse core identities for core-owned primitive services.
          path = Path("rust/crates/phenix-plugin-models/src/implementation.rs")
          text = path.read_text()
          text = replace_once(
              text,
              "pub use phenix_core::{ModelInferenceRequest, ModelInferenceResponse};\n",
              """pub use phenix_core::{
              model_inference_service, ModelInferenceRequest, ModelInferenceResponse,
              MODEL_INFERENCE_SERVICE,
          };
          """,
              "model primitive re-export",
          )
          text = replace_once(
              text,
              'pub const MODEL_INFERENCE_SERVICE: &str = "phenix.models.inference@1";\n',
              "",
              "duplicate model inference constant",
          )
          text = replace_once(
              text,
              """#[must_use]
          pub fn model_inference_service() -> ServiceId {
              ServiceId::parse(MODEL_INFERENCE_SERVICE).expect("static service id is valid")
          }

          """,
              "",
              "duplicate model inference helper",
          )
          path.write_text(text)

          path = Path("rust/crates/phenix-plugin-context/src/implementation.rs")
          text = path.read_text()
          text = replace_once(
              text,
              """pub use phenix_core::{
              ContextDescriptor, ContextResourceKind, ContextResourceRevision, ContextScope,
          };
          """,
              """pub use phenix_core::{
              context_service, ContextDescriptor, ContextResourceKind, ContextResourceRevision,
              ContextScope, CONTEXT_SERVICE,
          };
          """,
              "context primitive re-export",
          )
          text = replace_once(
              text,
              'pub const CONTEXT_SERVICE: &str = "phenix.context@1";\n',
              "",
              "duplicate context service constant",
          )
          text = replace_once(
              text,
              """#[must_use]
          pub fn context_service() -> ServiceId {
              ServiceId::parse(CONTEXT_SERVICE).expect("static service id is valid")
          }

          """,
              "",
              "duplicate context service helper",
          )
          path.write_text(text)
          PY

      - name: Format and validate
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all
          nix run .#phenix-maintenance-command-1c6e6c4c02e5 -- fix
          cargo test --manifest-path rust/Cargo.toml -p phenix-core -p phenix-plugin-models -p phenix-plugin-context
          cargo clippy --manifest-path rust/Cargo.toml -p phenix-core -p phenix-plugin-models -p phenix-plugin-context --all-targets -- -D warnings
          git diff --check

      - name: Commit semantic change
        run: |
          set -euo pipefail
          rm .github/workflows/worker-404-simplify-derived.yml
          git config user.name "phenix-worker"
          git config user.email "phenix-worker@users.noreply.github.com"
          git add -A
          git commit -m "refactor: derive resolved composition state"
          git push origin HEAD:feat/layered-service-overrides

name: Reject worker comment transport

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  delete-forbidden-transport-comment:
    if: >-
      startsWith(github.event.comment.body, '<!-- phenix-worker-patch-v1 -->') ||
      startsWith(github.event.comment.body, 'worker-exec')
    runs-on: ubuntu-latest
    steps:
      - name: Delete worker transport comment
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID"

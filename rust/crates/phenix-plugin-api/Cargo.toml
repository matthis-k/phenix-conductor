phenix-plugin-execution = { path = "../phenix-plugin-execution" }
phenix-plugin-models = { path = "../phenix-plugin-models" }
phenix-plugin-options = { path = "../phenix-plugin-options" }
phenix-plugin-sessions = { path = "../phenix-plugin-sessions" }
serde.workspace = true
serde_json.workspace = true
